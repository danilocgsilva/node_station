services:
  node_station_db:
    image: postgres:16
    container_name: node_station_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - "./postgres_data:/var/lib/postgresql/data"
    ports:
      - "5443:5432"

  node_station_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: node_station_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@me.com
      PGADMIN_DEFAULT_PASSWORD: strongpassword
    volumes:
      - "./pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8380:80"
    depends_on:
      - node_station_db


